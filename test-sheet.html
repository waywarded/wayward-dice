<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayward Dice test sheet</title>
    <style>
      body { margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #eee; background: #222639; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      button { padding: 6px 8px; text-align: left; border: 0; border-radius: 6px; background: #3a3f55; color: #eee; cursor: pointer; }
      button:hover { background: #4a5070; }
      #status { margin: 8px 0; }
      #log { height: 300px; overflow: auto; background: #1a1d2b; padding: 8px; border-radius: 6px; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Wayward Dice test sheet</h1>
    <div class="buttons" id="buttons"></div>
    <div id="status">Waiting for Owlbear Rodeo…</div>
    <div id="log"></div>
    <script type="module" src="/src/testSheet.ts"></script>
  </body>
</html>
